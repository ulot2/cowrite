<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cowrite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
  <style>
    /* Tokens. Every later screen uses these names, never raw values. */
    :root {
      color-scheme: light dark;
      --bg: #f6f6f4;
      --surface: #ffffff;
      --fg: #1b1c1f;
      --fg-muted: #64686f;
      --border: #e3e3df;
      --accent: #3453d1;
      --accent-soft: rgba(52, 83, 209, 0.16);
      --ok: #1d8348;
      --warn: #b3761a;
      --radius: 6px;
      --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-display: "Instrument Serif", Georgia, serif;
      --t-fast: 150ms;
      --t-base: 220ms;
      --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
      --ease-in: cubic-bezier(0.4, 0, 1, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --surface: #18191c;
        --fg: #e9e9e6;
        --fg-muted: #9a9ea6;
        --border: #2b2d32;
        --accent: #8296ff;
        --accent-soft: rgba(130, 150, 255, 0.22);
        --ok: #4ec57c;
        --warn: #e0a43c;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 44rem;
      padding: 1.5rem 1rem 3rem;
      background: var(--bg);
      color: var(--fg);
      font: 400 15px/1.5 var(--font);
    }

    /* Toolbar: wordmark and status on the left, the two controls on the right. */
    .bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .brand { font: italic 400 1.375rem/1 var(--font-display); letter-spacing: -0.01em; margin: 0; }
    .field { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; color: var(--fg-muted); }
    input, button {
      font: inherit;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.375rem 0.625rem;
      transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
    }
    input { width: 8.5rem; }
    button { cursor: pointer; }
    button:hover { border-color: var(--fg-muted); }
    input:hover { border-color: var(--fg-muted); }
    :is(input, button):focus-visible, #editor .cm-editor.cm-focused {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Status: a dot that changes color, and text for everyone else. */
    #status { display: flex; align-items: center; gap: 0.5rem; margin: 0; color: var(--fg-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); transition: background var(--t-fast); }
    #status[data-state="connected"] .dot { background: var(--ok); }
    #status[data-state="connecting"] .dot { animation: pulse 1.2s var(--ease-out) infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }

    /* Editor surface: paper on the page. */
    #editor {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -12px rgba(0, 0, 0, 0.12);
    }
    #editor .cm-editor { min-height: 62vh; border-radius: inherit; transition: box-shadow var(--t-fast); }
    #editor .cm-scroller { font: 400 17px/1.65 var(--font); padding: 1.5rem 1.75rem 2rem; overflow-x: hidden; } /* lines wrap; a name label near the edge must not add a scrollbar */
    @media (max-width: 480px) { #editor .cm-scroller { padding: 1rem 1.125rem 1.5rem; } }
    #editor .cm-content { padding: 1.25rem 0 0; caret-color: var(--fg); } /* top room for a name label on line one */
    #editor .cm-line { padding: 0; }
    #editor .cm-placeholder { color: var(--fg-muted); }
    #editor .cm-content ::selection { background: var(--accent-soft); }

    /* The other user's cursor. The library hides the name until hover; we show it, and let it rise in once. */
    #editor .cm-ySelectionInfo {
      opacity: 1;
      transition: none;
      font: 500 0.75rem/1.4 var(--font);
      padding: 0 0.375rem;
      border-radius: 4px;
      animation: rise var(--t-base) var(--ease-out);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  </style>
</head>
<body>
  <header class="bar">
    <h1 class="brand">cowrite</h1>
    <p id="status" role="status" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="status-text">Connecting…</span></p>
    <label class="field">Your name <input id="name" type="text" maxlength="24" autocomplete="off"></label>
    <button id="toggle" type="button">Go offline</button>
  </header>
  <div id="editor"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
